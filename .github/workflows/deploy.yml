name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  deploy:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-deploy.yml@v4
    # PAS de `secrets: inherit` : le seul secret déclaré par
    # `pwa-deploy.yml` est `FIREBASE_SERVICE_ACCOUNT_KEY`, et ce dépôt ne
    # déploie pas sur Firebase. Hériter enverrait TOUS les secrets du dépôt
    # à un workflow qui n'en attend aucun ici.
    with:
      use-base-path: true
      # URL du relais vers l'API de management (voir proxy/README.md), posée en
      # variable de dépôt `SUPABASE_PROXY_URL`. Vide = création de projet et
      # copie de structure indisponibles sur le site publié ; la copie des
      # données, elle, n'en dépend pas.
      build-env: VITE_SUPABASE_PROXY=${{ vars.SUPABASE_PROXY_URL }}
